# SPDX-FileCopyrightText: 2026 Olajide Badejo <olajideayomidebadejo@gmail.com>
#
# SPDX-License-Identifier: MIT
#
# The main CI pipeline of Section 19, with the per phase activation table of
# Section 19.0 encoded literally.
#
# The rule that shapes this whole file: a step that is off says so in the run
# log. Section 19.0 is explicit that silence and success must not look the
# same, so every guarded off step below is a real step that prints what it is
# and which phase turns it on. Reading the log of a green run tells you what
# ran and what did not, which is the only way a gate that cannot yet be met
# stays honest rather than quietly weakening.
#
# Active at P0: dash-lint and its self test, reuse lint, ruff, black --check,
# configure, build, check-npu.
# Added at P1: check-reachability --skip-models, DIALECT_REFERENCE.md staleness.
# Added at P2: NPUInterfaceTests, and the coverage job at a threshold of 0.
# Added at P5: NPUAllocatorTests.
# Added at P6: NPUEncodingTests, the ISA staleness gate, and the sanitizers job.
# Added at P7: NPUSimulatorTests, in this job and inside the sanitizers job's
# existing GoogleTest step.
# Added at P8: check-reachability in full, with the model IR built in the same
# step, and the coverage thresholds set from what P8 measured.
# Added at P9b: the ndebug job, which is the release half of Section 9.3's
# "every build mode", and regression-baseline --check at the end of
# build-and-test.
# Everything else prints its off line.

name: ci

on:
  push:
    branches:
      - "phase/**"
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_TAG: llvmorg-22.1.8
  # Lowercase owner is mandatory for GHCR; the account is Olajide-Badejo.
  LLVM_IMAGE: ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8

jobs:
  # -------------------------------------------------------------------------
  # lint. Plain runner, no LLVM needed. Activation table rows: dash-lint P0,
  # reuse lint P0, ruff and black P0, mypy P3, check-reachability P1 and P8.
  # -------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The linters are installed by exact pin rather than from
      # requirements-lock.txt, and the versions are the ones the lock file
      # resolved to, kept identical on purpose. Installing the full lock here
      # would pull torch, onnxruntime, and matplotlib into a job that runs four
      # linters, which is several hundred megabytes and a couple of minutes
      # bought for nothing. The pins are the contract; if the lock file moves,
      # these move with it in the same commit.
      - name: Install the linters
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            black==26.5.1 \
            ruff==0.15.21 \
            reuse==6.2.0

      # Ground rule 3, on from the first commit. The linter is run twice on
      # purpose: once over the tree, and once against its own fixture, because
      # the fixture is what proves the verbatim exemption fires in both
      # directions. A linter that passes everything is indistinguishable from a
      # linter that checks nothing, and --self-test is what tells them apart.
      - name: "dash lint (activation table: P0, on)"
        run: bash scripts/dash-lint.sh

      - name: "dash lint self test (activation table: P0, on)"
        run: bash scripts/dash-lint.sh --self-test

      - name: "reuse lint (activation table: P0, on)"
        run: reuse lint

      - name: "ruff (activation table: P0, on)"
        run: ruff check .

      - name: "black --check (activation table: P0, on)"
        run: black --check --diff .

      # mypy: ON at P3. The guard is python/npu_frontend/ existing, which is the
      # directory mypy is configured to check, and it is satisfied from this
      # phase. It stays in place rather than being deleted for the same reason
      # the reachability guard did at P1: it is what the activation table asks
      # for. But now that the phase has arrived, an unsatisfied guard means the
      # package moved rather than a phase that has not landed, so the else
      # branch fails rather than printing an off line.
      #
      # numpy is installed alongside mypy and it is not optional. It ships type
      # information, the frontend uses it throughout, and without it mypy stops
      # at "cannot find implementation or library stub for module named numpy"
      # instead of checking anything. Adding numpy to the ignore_missing_imports
      # list in pyproject.toml would weaken the configuration to save twenty
      # megabytes. The imports that are ignored there are ignored for a reason
      # that does not apply to numpy: neither the MLIR bindings, which are not
      # pip installed at all, nor onnx's protobuf generated classes carry type
      # information usable here.
      - name: "mypy (activation table: P3, on)"
        run: |
          set -euo pipefail
          if [ ! -d python/npu_frontend ]; then
            echo "::error::python/npu_frontend/ is missing."
            echo "mypy: this step is ON from P3, so an unsatisfied guard means the"
            echo "mypy: package moved rather than a phase that has not arrived."
            exit 1
          fi
          python -m pip install mypy==2.3.0 numpy==2.5.1
          mypy

      # check-reachability --skip-models: ON at P1. The guard stays in place
      # rather than being deleted, because it is what the activation table asks
      # for and because a guard that is satisfied still prints nothing while an
      # unguarded step that broke would print a confusing error. It is now
      # satisfied, so this step runs for real.
      #
      # The path in the guard was wrong until P1 activated it: it read
      # include/npu/NPUOps.td, and the repository layout puts the file at
      # include/NPU/Dialect/NPU/IR/NPUOps.td. A guard that can never be
      # satisfied is a step that is off forever while reporting that it is
      # merely waiting for a phase, which is the failure the activation table
      # exists to prevent. Recorded as D-0006.
      - name: "check-reachability --skip-models (activation table: P1, on)"
        run: |
          set -euo pipefail
          if [ -f scripts/check-reachability.py ] \
             && [ -f include/NPU/Dialect/NPU/IR/NPUOps.td ]; then
            python scripts/check-reachability.py --skip-models
          else
            echo "check-reachability --skip-models: the guard is not satisfied."
            echo "check-reachability: this step is ON from P1, so an unsatisfied"
            echo "check-reachability: guard means a file moved. Failing rather than"
            echo "check-reachability: reporting a pass that checked nothing."
            exit 1
          fi

  # -------------------------------------------------------------------------
  # build-and-test. Runs inside the prebuilt LLVM image so that no job here
  # ever compiles LLVM.
  #
  # FIRST PUSH WILL BE RED HERE, and that is expected rather than a defect.
  # This job pulls ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8, which
  # does not exist until llvm-image.yml has published it once. On the very
  # first push of this branch both workflows start together, the image is
  # roughly an hour away, and this job fails at the container pull before a
  # single step runs. The fix is not a change to this file: it is to let
  # llvm-image finish and then rerun this workflow.
  # -------------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    permissions:
      contents: read
      # Reading the package is what the container pull needs. GITHUB_TOKEN is
      # passed as the registry credential because the package is private until
      # somebody makes it public, and a job cannot pull a private GHCR image
      # anonymously.
      packages: read

    container:
      image: ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Inside a job container the runner falls back to sh for run steps, and sh
    # is dash on this image, which rejects set -o pipefail. bash is present in
    # the image, it just has to be asked for by name.
    defaults:
      run:
        shell: bash

    env:
      CCACHE_DIR: /work/.ccache
      CCACHE_MAXSIZE: 2G

    steps:
      # fetch-depth: 0, and this is D-0041 rather than a preference.
      #
      # actions/checkout defaults to fetch-depth 1, which is one commit and no
      # history. P10 is the first phase whose tests ask questions about history:
      # law 3 of Section 0.2 asserts that every published number traces to a
      # commit that resolves, and law 4's mechanism is `git merge-base
      # --is-ancestor` between a prediction's commit and the commit a result was
      # measured at. Neither question has an answer in a checkout that fetched
      # one commit, and the first CI run of this phase produced eight failures
      # that were all this.
      #
      # Depth 0 rather than a narrower fetch. A narrow fetch would have to name
      # the commits to deepen to, which are the shas recorded in result files and
      # in prediction entries, so the fetch would need updating every time a
      # result is re-recorded and would fail in exactly the situation it exists
      # to serve. This repository is a few hundred commits and the full fetch
      # costs seconds.
      #
      # The code no longer depends on this being right, which is the other half
      # of D-0041: `npu_frontend.predictions.require_full_history` refuses with
      # one readable message when the history is absent, rather than reporting
      # every historical sha as a commit that does not exist.
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Report the image this job is running in
        run: |
          set -euxo pipefail
          cat /opt/llvm/llvm-project-sha.txt
          mlir-opt --version
          clang --version
          echo "expected LLVM tag: ${LLVM_TAG}"

      # Section 19: cache the build directory and ccache between runs, keyed on
      # the LLVM tag. The tag is in the key because a different LLVM is a
      # different ABI and reusing objects across it is how a confusing link
      # error gets manufactured.
      - name: Restore the ccache and build cache
        uses: actions/cache@v4
        with:
          path: |
            /work/.ccache
            build
          key: npu-build-${{ env.LLVM_TAG }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            npu-build-${{ env.LLVM_TAG }}-${{ runner.os }}-

      # The paths are the install prefix of docker/Dockerfile.llvm. They are
      # written out rather than taken from the image's MLIR_DIR and LLVM_DIR,
      # so that this file records what it expects the image to contain.
      - name: "Configure (activation table: P0, on)"
        run: |
          set -euxo pipefail
          # LLVM_EXTERNAL_LIT: an installed LLVM does not ship the build tree's
          # llvm-lit script, so against /opt/llvm the lit target must be told
          # to use the pip installed lit. The local build against the LLVM
          # build tree does not need this, which is exactly why CI caught it
          # (D-0005).
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMLIR_DIR=/opt/llvm/lib/cmake/mlir \
            -DLLVM_DIR=/opt/llvm/lib/cmake/llvm \
            -DLLVM_EXTERNAL_LIT="$(command -v lit)" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_USE_LINKER=lld \
            -DMLIR_PYTHON_PACKAGES_DIR=/opt/llvm/python_packages/mlir_core
          # The bindings path is passed explicitly here and derived from
          # LLVM_BINARY_DIR everywhere else. Against a build tree the derived
          # path is right; against this image's installed prefix it resolves to
          # /opt/llvm/tools/mlir/python_packages/mlir_core, which does not
          # exist, because the install layout puts the package at
          # /opt/llvm/python_packages/mlir_core instead. Passing it removes the
          # configure warning and makes the cache, lit, and the pytest conftest
          # agree on one directory rather than three.

      # Section 3.3 writes -j6, which is right for the memory capped WSL2 guest
      # it was written for. A hosted runner is 4 vCPU, so -j4 is the matching number
      # here: -j6 on four cores buys nothing and costs memory headroom.
      - name: "Build (activation table: P0, on)"
        run: |
          set -euxo pipefail
          ninja -C build -j4
          ccache --show-stats || true

      - name: "check-npu (activation table: P0, on)"
        # Permitted to report zero tests until P1 per the activation table. It
        # currently runs one lit smoke test, so this is meaningful already.
        run: ninja -C build check-npu

      # ---- GoogleTest binaries. Each guarded on its binary existing. --------
      #
      # NPUInterfaceTests: ON at P2. The guard stays in place rather than being
      # deleted, for the same reason the reachability guard did at P1: it is what
      # the activation table asks for. But now that the phase has arrived, an
      # unsatisfied guard means the binary did not build, and reporting that as
      # "waiting for a phase" would be the activation table's own failure mode.
      # So the else branch fails rather than printing an off line.
      #
      # The binary building at all in this image is a P2 deliverable in its own
      # right. An installed LLVM prefix exports neither the `llvm_gtest` target
      # nor the bundled gtest headers, so the top level CMakeLists falls back to
      # find_package(GTest) and docker/Dockerfile.llvm installs libgtest-dev for
      # it to find. Before that pair of changes this step could never have run.
      - name: "NPUInterfaceTests (activation table: P2, on)"
        run: |
          set -euo pipefail
          if [ -x build/bin/NPUInterfaceTests ]; then
            ./build/bin/NPUInterfaceTests
          else
            echo "::error::NPUInterfaceTests did not build."
            echo "NPUInterfaceTests: this step is ON from P2, so a missing binary"
            echo "NPUInterfaceTests: is a build failure rather than a phase that has"
            echo "NPUInterfaceTests: not arrived. Check the configure log for the"
            echo "NPUInterfaceTests: 'GoogleTest:' line: the image must carry"
            echo "NPUInterfaceTests: libgtest-dev for the system package fallback."
            exit 1
          fi

      # NPUAllocatorTests: ON at P5. The guard stays in place rather than being
      # deleted, for the same reason it did for NPUInterfaceTests at P2: it is
      # what the activation table asks for. Now that the phase has arrived, an
      # unsatisfied guard means the binary did not build, and reporting that as
      # "waiting for a phase" would be the activation table's own failure mode,
      # so the else branch fails rather than printing an off line.
      #
      # It carries Section 17.2's property test: the sweep line peak against a
      # brute force recomputation over 1000 randomized interval sets at a fixed
      # seed, plus the placement invariant over the same sets under both offset
      # assignment strategies. The seed is a constant in the source, so a red
      # run here reproduces locally from the case number in the message.
      - name: "NPUAllocatorTests (activation table: P5, on)"
        run: |
          set -euo pipefail
          if [ -x build/bin/NPUAllocatorTests ]; then
            ./build/bin/NPUAllocatorTests
          else
            echo "::error::NPUAllocatorTests did not build."
            echo "NPUAllocatorTests: this step is ON from P5, so a missing binary"
            echo "NPUAllocatorTests: is a build failure rather than a phase that has"
            echo "NPUAllocatorTests: not arrived. Check the configure log for the"
            echo "NPUAllocatorTests: 'GoogleTest:' line: the image must carry"
            echo "NPUAllocatorTests: libgtest-dev for the system package fallback."
            exit 1
          fi

      # NPUEncodingTests: ON at P6. The guard stays in place rather than being
      # deleted, for the same reason it did for NPUInterfaceTests at P2 and
      # NPUAllocatorTests at P5: it is what the activation table asks for. Now
      # that the phase has arrived, an unsatisfied guard means the binary did
      # not build, and reporting that as "waiting for a phase" would be the
      # activation table's own failure mode, so the else branch fails.
      #
      # It carries four things: the round trips and the frozen opcode
      # numbering, every one of Section 9.2's thirty three checks triggered at
      # least once, Section 17.2's property test at 1000 iterations and a fixed
      # seed, and Section 17.3's seed and regression corpus at 733 cases. The
      # seed is a constant in the source, so a red run here reproduces locally
      # from the case number in the message.
      #
      # This build is also the one that measures the corpus's allocation bound.
      # The sanitizers job runs the same corpus for memory safety and skips
      # that one test, because AddressSanitizer replaces operator new itself
      # and the two cannot share a binary. Both claims are made; neither is
      # made twice.
      - name: "NPUEncodingTests (activation table: P6, on)"
        run: |
          set -euo pipefail
          if [ -x build/bin/NPUEncodingTests ]; then
            ./build/bin/NPUEncodingTests
          else
            echo "::error::NPUEncodingTests did not build."
            echo "NPUEncodingTests: this step is ON from P6, so a missing binary"
            echo "NPUEncodingTests: is a build failure rather than a phase that has"
            echo "NPUEncodingTests: not arrived. Check the configure log for the"
            echo "NPUEncodingTests: 'GoogleTest:' line: the image must carry"
            echo "NPUEncodingTests: libgtest-dev for the system package fallback."
            exit 1
          fi

      # NPUSimulatorTests. ON at P7, and the guard keeps its shape: what changes
      # is that the else branch is now a failure rather than an off line, which
      # is what NPUInterfaceTests did at P2 and NPUEncodingTests at P6.
      #
      # It carries the semantics test per opcode of Section 10.1's P7 list, the
      # two timelines and the overlap fraction at both endpoints of Section 5.5,
      # the bounds checked accessors of Section 9.3, and the determinism claim of
      # Section 10.3. The differential export inside it is skipped here and run
      # by the pytest step, which is the half that needs the reference
      # interpreter beside it.
      #
      # This build is an assertions build. The NDEBUG half of Section 9.3's
      # "every build mode" is the ndebug job below, which is new at P9b.
      #
      # It used to say the sanitizers job was that half, "which configures
      # RelWithDebInfo and therefore compiles with -DNDEBUG". That was wrong
      # from the day it was written and it is D-0036. D-0028 is the reason:
      # against an assertions LLVM, `HandleLLVMOptions` appends `-UNDEBUG`
      # **after** whatever the build type supplied, and the last `-D` or `-U`
      # on a command line wins. Measured on 2026-09-01, a RelWithDebInfo
      # configure of this project against the assertions LLVM ends its flags
      # with `-D_DEBUG -D_GLIBCXX_ASSERTIONS -UNDEBUG`. So CI has been naming a
      # build mode it did not have since P7, in a comment rather than in a
      # test, which is why nothing went red.
      - name: "NPUSimulatorTests (activation table: P7, on)"
        run: |
          set -euo pipefail
          if [ -x build/bin/NPUSimulatorTests ]; then
            ./build/bin/NPUSimulatorTests
          else
            echo "::error::NPUSimulatorTests did not build."
            echo "NPUSimulatorTests: this step is ON from P7, so a missing binary"
            echo "NPUSimulatorTests: is a build failure rather than a phase that has"
            echo "NPUSimulatorTests: not arrived. Check the configure log for the"
            echo "NPUSimulatorTests: 'GoogleTest:' line and for the 'OpenMP:' line,"
            echo "NPUSimulatorTests: which says which way that option went."
            exit 1
          fi

      # ---- pytest. ON at P3.
      #
      # Two things the image does not have and this step needs. The Python
      # dependencies, which are installed from requirements-lock.txt because the
      # lock file is the environment this project pins and a hand written short
      # list here would be a second, quietly diverging one. And a built
      # npu-opt, which is why this step is ordered after the build rather than
      # beside it: the importer verifies every module it emits by round tripping
      # it through npu-opt, and without the binary it raises rather than
      # returning IR nobody checked.
      #
      # The pip cache is what keeps this sane. The torch CPU wheels alone are a
      # few hundred megabytes, and the key is the hash of the lock file, so the
      # download happens again only when the pinned environment actually moves.
      - name: Restore the pip cache
        uses: actions/cache@v4
        with:
          path: /root/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: "Install the Python dependencies (activation table: P3, on)"
        run: |
          set -euxo pipefail
          # --break-system-packages because this image's python3 is a PEP 668
          # marked Debian one and the container is the environment, which is the
          # same argument docker/Dockerfile.llvm makes for its own installs.
          python3 -m pip install --break-system-packages -r requirements-lock.txt
          python3 -c "import torch, onnx, onnxruntime, onnxscript, numpy; print('deps ok')"

      # An empty collection returns 5, and the activation table says that is
      # never read as a pass. So the exit code is inspected rather than trusted:
      # 5 is turned into a failure with a message saying what it means, and the
      # guard on a test file existing is separate from it, because a missing
      # file and an empty collection are different faults with different fixes.
      - name: "pytest (activation table: P3, on)"
        env:
          # conftest.py resolves the bindings from this first, then from the
          # CMake cache, then from a default. Setting it means the test suite
          # does not depend on the configure step having got the path right.
          MLIR_PYTHON_PACKAGES_DIR: /opt/llvm/python_packages/mlir_core
        run: |
          set -uo pipefail
          if [ ! -f test/Python/test_onnx_importer.py ]; then
            echo "::error::test/Python/test_onnx_importer.py is missing."
            echo "pytest: this step is ON from P3, so a missing test file is a file"
            echo "pytest: that moved rather than a phase that has not arrived."
            exit 1
          fi
          python3 -m pytest test/Python -q
          status=$?
          if [ "$status" -eq 5 ]; then
            echo "::error::pytest collected no tests and exited 5."
            echo "pytest: exit code 5 means an empty collection, which the"
            echo "pytest: activation table says is never read as a pass. Either the"
            echo "pytest: testpaths setting in pyproject.toml no longer points at"
            echo "pytest: any test, or every test was deselected by the default"
            echo "pytest: marker expression."
            exit 1
          fi
          exit "$status"

      # ON at P10. The step above runs pytest's default marker expression, which
      # deselects `slow`; this one runs everything.
      #
      # **What is actually slow, and it is not what P9 expected.** The off line
      # this step replaced said the full matrix runs here, on the assumption that
      # P10's ablation cells would arrive beside the end to end cells and make
      # the matrix expensive. They did not: Section 16.2's ablations are a
      # benchmark suite rather than a test matrix, they write result files rather
      # than assert, and they live in experiments/run_benchmarks.py. The end to
      # end matrix is 426 tests in about 25 seconds and is still not marked slow.
      #
      # Nine tests carry the marker, and only two of them are P10's:
      # test/Python/test_benchmarks.py drives a real run of the benchmark suite
      # twice, once for Section 16.1's determinism test and once for the failure
      # branch of the 90 minute budget gate.
      #
      # **The other seven predate this step by six phases and CI has never run
      # one of them.** test_every_model_imports_at_a_second_seed has been marked
      # slow, one case per model, since the model suite landed. It runs on the
      # developer machine, where the verification matrix uses
      # -m 'slow or not slow'; it has never run in CI, because the only step that
      # would is this one and this one was off. That is D-0040 and it is the
      # mirror of D-0037: a result that depends on what is lying around locally
      # and is invisible in CI. Turning this step on is what closes it, and the
      # first green run is the proof rather than this comment.
      #
      # The guard is on the collected count and not on the exit code. A run that
      # deselected every slow test would exit 0 having done exactly what the step
      # above already did, which is the shape of a step that is on and asserting
      # nothing.
      - name: "pytest slow cells (activation table: P10, on)"
        env:
          MLIR_PYTHON_PACKAGES_DIR: /opt/llvm/python_packages/mlir_core
          NPU_BUILD_DIR: ${{ github.workspace }}/build
        run: |
          set -uo pipefail
          slow=$(python3 -m pytest test/Python -q --collect-only -p no:cacheprovider \
                   -m slow 2>/dev/null | grep -c '::' || true)
          echo "pytest slow cells: ${slow} tests carry the slow marker."
          if [ "$slow" -eq 0 ]; then
            echo "::error::no test carries the slow marker."
            echo "pytest slow cells: this step is ON from P10 and its whole"
            echo "pytest slow cells: purpose is the tests the step above"
            echo "pytest slow cells: deselects. Zero of them means this step is"
            echo "pytest slow cells: a second copy of the previous one, which is"
            echo "pytest slow cells: a step that is on and asserting nothing."
            exit 1
          fi
          python3 -m pytest test/Python -q -m 'slow or not slow'
          status=$?
          if [ "$status" -eq 5 ]; then
            echo "::error::pytest collected no tests and exited 5."
            echo "pytest slow cells: an empty collection is never read as a pass."
            exit 1
          fi
          exit "$status"

      # ---- Staleness gates. -------------------------------------------------
      # DIALECT_REFERENCE.md staleness: ON at P1.
      #
      # The step regenerates the file from the ODS source and diffs it against
      # the committed one. A difference means the dialect changed and the
      # reference did not, which is exactly the drift the generated reference
      # exists to make impossible. The diff itself is printed, because a gate
      # that says only "stale" makes the reader run the command locally to find
      # out what moved, and printing it costs nothing.
      #
      # git config safe.directory is needed because the checkout is owned by the
      # runner user and the container runs as root, so git refuses to read the
      # repository without being told it is trusted.
      - name: "DIALECT_REFERENCE.md staleness (activation table: P1, on)"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ ! -f docs/DIALECT_REFERENCE.md ]; then
            echo "docs/DIALECT_REFERENCE.md is missing. It is generated by"
            echo "  ninja -C build npu-dialect-doc"
            echo "and committed, and this step is ON from P1."
            exit 1
          fi
          ninja -C build npu-dialect-doc
          if ! git diff --quiet -- docs/DIALECT_REFERENCE.md; then
            echo "::error::docs/DIALECT_REFERENCE.md is stale."
            echo ""
            echo "The dialect source changed and the committed reference did not."
            echo "What moved:"
            echo ""
            git --no-pager diff -- docs/DIALECT_REFERENCE.md
            echo ""
            echo "Fix it with:"
            echo ""
            echo "    ninja -C build npu-dialect-doc"
            echo ""
            echo "and commit the result in the same commit as the dialect change."
            exit 1
          fi
          echo "docs/DIALECT_REFERENCE.md is up to date with the ODS source."

      # ISA staleness gate: ON at P6. Section 9.4 asks for this to be identical
      # in shape to the DIALECT_REFERENCE.md gate above, so that there is one
      # staleness mechanism in this project rather than two, and it is: the
      # script regenerates from include/NPU/Encoding/NPUISADescription.td and
      # diffs the two committed artifacts, docs/ISA_MANUAL.md and
      # docs/ISA_OPCODES.json.
      #
      # The guard stays in place and its else branch fails, for the same reason
      # every other activated guard's does.
      #
      # git config safe.directory is set by the DIALECT_REFERENCE step above
      # and is needed here for the same reason: the checkout is owned by the
      # runner user and the container runs as root, so git refuses to read the
      # repository without being told it is trusted. The script's own tracked
      # file check would otherwise report every artifact as untracked.
      - name: "ISA staleness gate (activation table: P6, on)"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -f scripts/check-isa-staleness.sh ]; then
            bash scripts/check-isa-staleness.sh build
          else
            echo "::error::scripts/check-isa-staleness.sh is missing."
            echo "ISA staleness gate: this step is ON from P6, so a missing script"
            echo "ISA staleness gate: means a file moved rather than a phase that"
            echo "ISA staleness gate: has not arrived."
            exit 1
          fi

      # ---- Reachability, full. ON at P8, and the table explains why the guard
      # was a phase rather than a file: the model suite lands at P3 but the full
      # check also wants a lowering pattern (P4), an encoder case (P6), and a
      # simulator case (P7) for every operation. P8 is the first phase at which
      # it is passable rather than merely runnable, so a file guard would have
      # switched it on at P3 and failed for four phases.
      #
      # The guard keeps its shape and its else branch is now a failure, which is
      # what NPUInterfaceTests did at P2, NPUEncodingTests at P6 and
      # NPUSimulatorTests at P7.
      #
      # **Two commands, one step, and that is deliberate.** The model layer of
      # Section 17.5 asks that each operation appear in at least one generated
      # benchmark model's IR, and the IR is a build artifact that no phase
      # commits. scripts/build-model-ir.py writes it into experiments/models/
      # and it runs here rather than in a step of its own, because a step of its
      # own would be a second activation to prove for a command whose only
      # purpose is to give this one something to look in.
      #
      # It runs after the pytest step because it needs the same Python
      # dependencies and the same built npu-opt, and after the ISA staleness
      # gate because the check reads docs/ISA_OPCODES.json for two of its five
      # layers and a stale one would be answering from a description the source
      # no longer matches.
      - name: "check-reachability full (activation table: P8, on)"
        run: |
          set -euo pipefail
          if [ ! -f scripts/check-reachability.py ] \
             || [ ! -f scripts/build-model-ir.py ]; then
            echo "::error::a reachability script is missing."
            echo "check-reachability: this step is ON from P8, so an unsatisfied"
            echo "check-reachability: guard means a file moved rather than a phase"
            echo "check-reachability: that has not arrived."
            exit 1
          fi
          export PYTHONPATH="/opt/llvm/python_packages/mlir_core:${PWD}/python"
          python3 scripts/build-model-ir.py
          python3 scripts/check-reachability.py

      # ---- regression-baseline --check. ON at P9b. -------------------------
      #
      # **Why it was not a step until now, and what changed.** P8 and P9 both
      # left it out for the same stated reason: its golden comparison is byte
      # identical, which is a bound between two runs of the *same* build, and a
      # baseline recorded under gcc on a developer machine being checked under
      # clang in a container is not that. The two phases sharpened the question
      # and neither answered it, because answering it needs a run.
      #
      # So the step is switched on with `GOLDEN_TOLERANCE` left at **zero**.
      # Widening the band first would have discarded the only measurement the
      # question is about: if this reproduces bit for bit across two compilers
      # and two libcs, that is a property worth having proven, and if it does
      # not, the drift report is the number to record. What must not happen is a
      # tolerance chosen in advance to make the first run green.
      #
      # It runs last in this job because it needs everything the job has: the
      # built binaries, the Python environment the pytest step installed, lit,
      # and a git that will read this checkout, which the DIALECT_REFERENCE step
      # above marked safe. It re-runs the lit suite, the five GoogleTest
      # binaries, pytest at `slow or not slow`, dash lint and the forty two
      # cells, which is duplicated work by design: Section 17.6's baseline is a
      # record of what one build measured, and a check that reused this job's
      # earlier results would be comparing the baseline against itself.
      #
      # Measured on the developer machine at 1 minute 42 seconds. On four vCPUs
      # expect several times that; it is the one step in this file whose cost is
      # a whole second pass over the suite.
      - name: "regression-baseline --check (activation table: P9b, on)"
        env:
          # Section 3.3's -j6 is the memory capped WSL2 guest's number. A hosted
          # runner is 4 vCPU, which is what every other build in this file uses.
          NPU_BASELINE_JOBS: "4"
          MLIR_PYTHON_PACKAGES_DIR: /opt/llvm/python_packages/mlir_core
        run: |
          set -uo pipefail
          if [ ! -f test/baseline/baseline.json ]; then
            echo "::error::test/baseline/baseline.json is missing."
            echo "regression-baseline: this step is ON from P9b, so a missing"
            echo "regression-baseline: baseline is a file that moved rather than"
            echo "regression-baseline: a phase that has not arrived. Record one"
            echo "regression-baseline: with scripts/regression-baseline.sh."
            exit 1
          fi
          bash scripts/regression-baseline.sh --check
          status=$?
          # The script has already printed every difference, one per line, above
          # this point. What is added here is what a reader of a red run needs
          # next, because the right response depends on which of two things
          # happened and the log cannot tell them apart on its own.
          if [ "$status" -eq 1 ]; then
            echo "::error::the regression baseline drifted in the container."
            echo ""
            echo "regression-baseline: every difference is listed above. Two"
            echo "regression-baseline: readings, and they are not the same fault."
            echo ""
            echo "regression-baseline:   1. A cell or a suite count moved. That"
            echo "regression-baseline:      is a change somebody made, and it is"
            echo "regression-baseline:      declared in docs/BREAKING_CHANGES.md"
            echo "regression-baseline:      and re-recorded in its own commit, or"
            echo "regression-baseline:      it is a defect."
            echo ""
            echo "regression-baseline:   2. Only golden tensors moved, and by"
            echo "regression-baseline:      a few units in the last place. That is"
            echo "regression-baseline:      the cross host question this step was"
            echo "regression-baseline:      switched on to answer: this container"
            echo "regression-baseline:      builds with clang against a different"
            echo "regression-baseline:      libc than the machine that recorded"
            echo "regression-baseline:      the baseline. The golden lines above"
            echo "regression-baseline:      carry the element count, the index and"
            echo "regression-baseline:      the movement in ulps, which is what"
            echo "regression-baseline:      that decision needs. Record the"
            echo "regression-baseline:      measured delta before touching"
            echo "regression-baseline:      GOLDEN_TOLERANCE, and never widen it"
            echo "regression-baseline:      past what was measured."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::regression-baseline could not run, exit ${status}."
            echo "regression-baseline: exit 2 is this script refusing to compare"
            echo "regression-baseline: rather than a comparison that failed: an"
            echo "regression-baseline: unconfigured build directory, a missing"
            echo "regression-baseline: baseline, a schema_version it does not"
            echo "regression-baseline: recognise, or a suite that wrote no"
            echo "regression-baseline: machine readable output."
            exit "$status"
          fi

  # -------------------------------------------------------------------------
  # sanitizers. ON at P6, and this is the phase where it stops being a job that
  # prints an off line and becomes a job that runs.
  #
  # Section 19 describes it as the same build with -fsanitize=address,undefined,
  # running the GoogleTests including the whole of MalformedInputTest, plus the
  # coverage guided target over the corpus in fuzz/corpus/ for its budgeted
  # time. That is what this is.
  #
  # It builds into its own directory with clang rather than reusing the gcc
  # build above, and it builds three targets rather than everything. The
  # encoding library carries no MLIR dependency, so NPUEncodingTests and
  # nbin_decode_fuzzer need the generator, the format library and gtest, which
  # is a couple of minutes rather than the whole compiler. A sanitizer job that
  # took as long as the main build is a job somebody starts skipping.
  #
  # -fsanitize=fuzzer is added by fuzz/CMakeLists.txt on the target; the address
  # and undefined sanitizers go on the whole build here, because a fuzz target
  # instrumented against a library that is not tells you only about the target.
  # -------------------------------------------------------------------------
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Report the toolchain this job is running with
        run: |
          set -euxo pipefail
          clang --version
          clang++ --version

      # NPU_ENABLE_FUZZERS is what turns fuzz/ on. It is off in every other
      # build, and the configure log says so, because a step that is off says
      # so. The "Fuzzers: ON" line below is the proof that this one is not.
      - name: "Configure with the sanitizers (activation table: P6, on)"
        run: |
          set -euxo pipefail
          cmake -G Ninja -S . -B build-san \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMLIR_DIR=/opt/llvm/lib/cmake/mlir \
            -DLLVM_DIR=/opt/llvm/lib/cmake/llvm \
            -DLLVM_EXTERNAL_LIT="$(command -v lit)" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_USE_LINKER=lld \
            -DNPU_ENABLE_FUZZERS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DMLIR_PYTHON_PACKAGES_DIR=/opt/llvm/python_packages/mlir_core \
            2>&1 | tee build-san-configure.log
          # The configure log says which way the option went, and this asserts
          # it rather than trusting the flag. An option that silently failed to
          # take would leave this job building the same thing the main build
          # already built, and passing.
          grep -q '^-- Fuzzers: ON' build-san-configure.log

      - name: Build the sanitized targets
        run: |
          set -euxo pipefail
          ninja -C build-san -j4 NPUEncodingTests NPUSimulatorTests \
            nbin_decode_fuzzer

      # The whole of MalformedInputTest, plus everything else in the binary.
      # halt_on_error makes UBSan fail the step rather than print and continue;
      # without it a runtime error is a line in a log that nothing reads. That
      # matters here more than anywhere: the first real run of this job found a
      # signed overflow in the validator's own range messages, D-0021.
      #
      # NPUSimulatorTests joins this step at P7 rather than getting one of its
      # own, and the reason is that it needs no new activation: this step is
      # already on and already proven red.
      #
      # **It does not do double duty, whatever this comment used to say.** It
      # claimed that RelWithDebInfo made this the NDEBUG half of Section 9.3's
      # "every build mode" as well as the memory safety half. It is not, and
      # that is D-0036: against an assertions LLVM `HandleLLVMOptions` appends
      # `-UNDEBUG` after the build type's `-DNDEBUG`, so this job runs the trap
      # tests with assertions **on**, exactly like build-and-test. The NDEBUG
      # half is the ndebug job, added at P9b, which forces the option and
      # asserts in its own configure log that it took.
      - name: "GoogleTests under ASan and UBSan (activation table: P6, on)"
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: |
          set -euo pipefail
          for binary in NPUEncodingTests NPUSimulatorTests; do
            if [ ! -x "build-san/bin/$binary" ]; then
              echo "::error::$binary did not build under the sanitizers."
              exit 1
            fi
            "./build-san/bin/$binary"
          done

      # Section 3.3's budgeted minute. The corpus is read from the copy the
      # nbin-fuzz-corpus target makes rather than from fuzz/corpus directly,
      # because libFuzzer writes newly interesting inputs into the first corpus
      # directory it is given and a corpus that grows during a run is a corpus
      # somebody commits by accident. The eight files are the same eight files.
      - name: "Coverage guided target, one minute (activation table: P6, on)"
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          if [ ! -x build-san/bin/nbin_decode_fuzzer ]; then
            echo "::error::nbin_decode_fuzzer did not build."
            echo "sanitizers: the target is behind -DNPU_ENABLE_FUZZERS=ON and needs"
            echo "sanitizers: a clang that supports -fsanitize=fuzzer."
            exit 1
          fi
          mkdir -p build-san/fuzz-artifacts
          ./build-san/bin/nbin_decode_fuzzer \
            -max_total_time=60 \
            -artifact_prefix=build-san/fuzz-artifacts/ \
            build-san/fuzz-corpus

      # A crash is minimized and committed as a regression case, per Section
      # 17.3, so the artifact has to leave the runner for that to be possible.
      - name: Upload any crash the run found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build-san/fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 30

  # -------------------------------------------------------------------------
  # ndebug. ON at P9b, and it is the release half of Section 9.3's "every build
  # mode" clause, made by a build that has actually had its assertions taken
  # out.
  #
  # **Why this is a job and not a step in build-and-test.** It is a third build
  # configuration in a third directory, which is what the sanitizers job is and
  # is why that is a job too. Folding a second configuration into
  # build-and-test would mean one job name covering two builds, so a red run
  # would say "build-and-test failed" for a fault that lives in exactly one of
  # them. It also runs in parallel, where a step would be serial inside a job
  # that already carries the longest budget in this file.
  #
  # **Why it builds two targets by name and not everything**, which is the same
  # rule the sanitizers job follows and here it is not an optimization but a
  # correctness requirement. D-0031: turning `_GLIBCXX_ASSERTIONS` off in this
  # project's translation units while the LLVM they link keeps it on is an ODR
  # violation across the link, benign for targets that link no MLIR and heap
  # corruption for anything that does. `NPUSimulatorTests` and
  # `NPUEncodingTests` link the format library and LLVM's Support and no MLIR
  # at all, which is exactly the set this directory may build. An `npu-opt`
  # built here aborts inside MLIR's own context construction on an empty
  # module.
  #
  # **Why not a second LLVM tree**, which is the fix D-0031 named. Because the
  # contract Section 9.3 states lives entirely in these two binaries, so a
  # non-assertions LLVM would buy coverage of MLIR linking tools that no clause
  # asks for, at an hour of build time per republish and a second image to keep
  # in step. `docs/adr/0009` is the record and the argument.
  #
  # **The configure log assertion is the whole point of the job.** D-0028 is
  # what happens without it: a Release build against an assertions LLVM keeps
  # its assertions, passes the four runs the gate asks for, and proves nothing.
  # `-DNPU_FORCE_NDEBUG=ON` makes the option mean what its name says and the
  # top level CMakeLists prints a line beginning `NDEBUG:` saying which way it
  # went. Grepping for it is the same shape as the sanitizers job's
  # `Fuzzers: ON` check and it exists for the same reason: an option that
  # silently failed to take would leave this job building what build-and-test
  # already built, and passing.
  # -------------------------------------------------------------------------
  ndebug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: "Configure with NDEBUG forced (activation table: P9b, on)"
        run: |
          set -euxo pipefail
          cmake -G Ninja -S . -B build-ndebug \
            -DCMAKE_BUILD_TYPE=Release \
            -DNPU_FORCE_NDEBUG=ON \
            -DMLIR_DIR=/opt/llvm/lib/cmake/mlir \
            -DLLVM_DIR=/opt/llvm/lib/cmake/llvm \
            -DLLVM_EXTERNAL_LIT="$(command -v lit)" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_USE_LINKER=lld \
            -DMLIR_PYTHON_PACKAGES_DIR=/opt/llvm/python_packages/mlir_core \
            2>&1 | tee build-ndebug-configure.log
          # The configure log says which way the option went, and this asserts
          # it rather than trusting the flag. Without this line the job is
          # D-0028 with more steps.
          grep -q '^-- NDEBUG: forced on' build-ndebug-configure.log

      # The two targets this directory may build, named rather than swept, per
      # D-0031 and the warning the configure above prints.
      - name: Build the two non MLIR binaries
        run: |
          set -euxo pipefail
          ninja -C build-ndebug -j4 NPUSimulatorTests NPUEncodingTests

      # Both binaries in full rather than a filtered subset. Section 9.3's
      # clause is about the bounds checked accessors, and `TrapTest` is where
      # those live, but a build without assertions changes what every test in
      # both binaries is running against, and running only the trap tests would
      # be asserting that the interesting half survived while leaving the rest
      # untested in this mode.
      - name: "NDEBUG GoogleTests (activation table: P9b, on)"
        run: |
          set -euo pipefail
          for binary in NPUSimulatorTests NPUEncodingTests; do
            if [ ! -x "build-ndebug/bin/$binary" ]; then
              echo "::error::$binary did not build under NDEBUG."
              echo "ndebug: this step is ON from P9b, so a missing binary is a"
              echo "ndebug: build failure rather than a phase that has not"
              echo "ndebug: arrived. Check the configure log for the line"
              echo "ndebug: beginning 'NDEBUG:', which says which way the"
              echo "ndebug: option went, and see D-0031 for what this"
              echo "ndebug: directory may and may not build."
              exit 1
            fi
            "./build-ndebug/bin/$binary"
          done

  # -------------------------------------------------------------------------
  # coverage. Off until P2. The table is precise about the two dates: the job
  # runs from P2 with thresholds of 0, so the number is recorded and its trend
  # is visible from the start, and P8 is where the real thresholds are set from
  # what P8 measures. Gating on a threshold before P8 would be gating on a
  # number nobody has measured.
  # -------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    env:
      # **The real thresholds, set at P8 from what P8 measured.** They were 0
      # from P2, which is what the activation table asked for while nobody had
      # measured anything. They are inputs to the script rather than constants
      # inside it, so the policy lives with the job and the measurement lives
      # with the script.
      #
      # Measured on 2026-08-31: C++ lines 86.0 percent, C++ branches 77.0
      # percent, Python lines 90.3 percent.
      #
      # 85 is Section 17.7's floor for C++ and sits one point below the
      # measurement. 90 is that section's rule for Python, which is the measured
      # value rounded down to a whole percent and never above what the suite
      # achieves.
      NPU_COVERAGE_THRESHOLD: "85"
      NPU_PYTHON_COVERAGE_THRESHOLD: "90"
      NPU_COVERAGE_JOBS: "4"
      # conftest.py resolves the bindings from this first. The coverage job
      # configures build-coverage/ and never build/, so the cache fallback the
      # conftest uses has nothing to read and the Python half of the measurement
      # would fail at `import mlir` for a reason that has nothing to do with
      # coverage.
      MLIR_PYTHON_PACKAGES_DIR: /opt/llvm/python_packages/mlir_core

    steps:
      # fetch-depth: 0 for the same reason as `build-and-test`, D-0041. This job
      # runs `scripts/coverage.sh`, which runs the whole pytest suite, so it asks
      # the same questions about history and needs the same answer available.
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The Python half of Section 17.7 needs the suite's dependencies, which
      # this job did not install while its thresholds were 0 and the Python half
      # did not exist. The pip cache is keyed on the lock file's hash, the same
      # as the build and test job's, so the torch wheels are downloaded again
      # only when the pinned environment actually moves.
      - name: Restore the pip cache
        uses: actions/cache@v4
        with:
          path: /root/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: "Install the Python dependencies (activation table: P8, on)"
        run: |
          set -euxo pipefail
          python3 -m pip install --break-system-packages -r requirements-lock.txt
          python3 -m pip install --break-system-packages gcovr==8.6
          python3 -c "import torch, onnx, onnxruntime, pytest_cov; print('deps ok')"

      # gcc rather than clang, and gcovr rather than llvm-cov. Section 17.7
      # permits either; gcovr against gcc's --coverage is the pairing this
      # project uses, and mixing clang's instrumentation with gcovr's gcov
      # frontend is the combination that produces a plausible looking zero.
      - name: "coverage (activation table: P2, on; real thresholds at P8, on)"
        run: |
          set -euo pipefail
          echo "coverage: ON from P2, and gating for real from P8."
          echo "coverage: C++ line threshold ${NPU_COVERAGE_THRESHOLD}, Python line threshold ${NPU_PYTHON_COVERAGE_THRESHOLD}."
          echo "coverage: measured at P8 on 2026-08-31: C++ 86.0, Python 90.3."
          echo ""
          bash scripts/coverage.sh \
            "${NPU_COVERAGE_THRESHOLD}" "${NPU_PYTHON_COVERAGE_THRESHOLD}"

      # The JSON summary is the artifact, not the log. Section 17.7 is explicit
      # that CI parses a JSON summary rather than grepping a percentage out of a
      # log, and keeping the file is what lets P8 set its thresholds from a
      # series of measurements rather than from one run somebody remembered.
      - name: Upload the coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: |
            build-coverage/coverage.json
            build-coverage/coverage.html
            build-coverage/python-coverage.json
          if-no-files-found: warn
          retention-days: 30
