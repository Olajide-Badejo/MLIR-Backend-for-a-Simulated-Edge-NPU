name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A fast, self contained code quality gate that needs no LLVM toolchain: the
# no dash rule and the Python linter. Building and running the compiler needs a
# prebuilt LLVM/MLIR (see docs/BUILD.md) and is done locally.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No em or en dashes
        run: bash scripts/dash-lint.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python lint (ruff)
        run: |
          python -m pip install --quiet "ruff==0.15.21"
          ruff check python test/Python experiments report/scripts
