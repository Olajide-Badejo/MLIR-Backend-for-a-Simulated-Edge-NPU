# SPDX-FileCopyrightText: 2026 Olajide Badejo <olajideayomidebadejo@gmail.com>
#
# SPDX-License-Identifier: MIT
#
# The main CI pipeline of Section 19, with the per phase activation table of
# Section 19.0 encoded literally.
#
# The rule that shapes this whole file: a step that is off says so in the run
# log. Section 19.0 is explicit that silence and success must not look the
# same, so every guarded off step below is a real step that prints what it is
# and which phase turns it on. Reading the log of a green run tells you what
# ran and what did not, which is the only way a gate that cannot yet be met
# stays honest rather than quietly weakening.
#
# Active at P0: dash-lint and its self test, reuse lint, ruff, black --check,
# configure, build, check-npu.
# Added at P1: check-reachability --skip-models, DIALECT_REFERENCE.md staleness.
# Added at P2: NPUInterfaceTests, and the coverage job at a threshold of 0.
# Everything else prints its off line.

name: ci

on:
  push:
    branches:
      - "phase/**"
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_TAG: llvmorg-22.1.8
  # Lowercase owner is mandatory for GHCR; the account is Olajide-Badejo.
  LLVM_IMAGE: ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8

jobs:
  # -------------------------------------------------------------------------
  # lint. Plain runner, no LLVM needed. Activation table rows: dash-lint P0,
  # reuse lint P0, ruff and black P0, mypy P3, check-reachability P1 and P8.
  # -------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The linters are installed by exact pin rather than from
      # requirements-lock.txt, and the versions are the ones the lock file
      # resolved to, kept identical on purpose. Installing the full lock here
      # would pull torch, onnxruntime, and matplotlib into a job that runs four
      # linters, which is several hundred megabytes and a couple of minutes
      # bought for nothing. The pins are the contract; if the lock file moves,
      # these move with it in the same commit.
      - name: Install the linters
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            black==26.5.1 \
            ruff==0.15.21 \
            reuse==6.2.0

      # Ground rule 3, on from the first commit. The linter is run twice on
      # purpose: once over the tree, and once against its own fixture, because
      # the fixture is what proves the verbatim exemption fires in both
      # directions. A linter that passes everything is indistinguishable from a
      # linter that checks nothing, and --self-test is what tells them apart.
      - name: "dash lint (activation table: P0, on)"
        run: bash scripts/dash-lint.sh

      - name: "dash lint self test (activation table: P0, on)"
        run: bash scripts/dash-lint.sh --self-test

      - name: "reuse lint (activation table: P0, on)"
        run: reuse lint

      - name: "ruff (activation table: P0, on)"
        run: ruff check .

      - name: "black --check (activation table: P0, on)"
        run: black --check --diff .

      # mypy activates at P3, guarded on python/npu_frontend/ existing. The
      # guard is the directory rather than a phase variable, because the
      # directory is the thing mypy needs and a phase number in a file is one
      # more thing to remember to update.
      - name: "mypy (activation table: P3)"
        run: |
          set -euo pipefail
          if [ -d python/npu_frontend ]; then
            python -m pip install mypy==2.3.0
            mypy
          else
            echo "mypy: OFF until P3 (activation table 19.0)."
            echo "mypy: guard is python/npu_frontend/ existing; it does not yet."
          fi

      # check-reachability --skip-models: ON at P1. The guard stays in place
      # rather than being deleted, because it is what the activation table asks
      # for and because a guard that is satisfied still prints nothing while an
      # unguarded step that broke would print a confusing error. It is now
      # satisfied, so this step runs for real.
      #
      # The path in the guard was wrong until P1 activated it: it read
      # include/npu/NPUOps.td, and the repository layout puts the file at
      # include/NPU/Dialect/NPU/IR/NPUOps.td. A guard that can never be
      # satisfied is a step that is off forever while reporting that it is
      # merely waiting for a phase, which is the failure the activation table
      # exists to prevent. Recorded as D-0006.
      - name: "check-reachability --skip-models (activation table: P1, on)"
        run: |
          set -euo pipefail
          if [ -f scripts/check-reachability.py ] \
             && [ -f include/NPU/Dialect/NPU/IR/NPUOps.td ]; then
            python scripts/check-reachability.py --skip-models
          else
            echo "check-reachability --skip-models: the guard is not satisfied."
            echo "check-reachability: this step is ON from P1, so an unsatisfied"
            echo "check-reachability: guard means a file moved. Failing rather than"
            echo "check-reachability: reporting a pass that checked nothing."
            exit 1
          fi

  # -------------------------------------------------------------------------
  # build-and-test. Runs inside the prebuilt LLVM image so that no job here
  # ever compiles LLVM.
  #
  # FIRST PUSH WILL BE RED HERE, and that is expected rather than a defect.
  # This job pulls ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8, which
  # does not exist until llvm-image.yml has published it once. On the very
  # first push of this branch both workflows start together, the image is
  # roughly an hour away, and this job fails at the container pull before a
  # single step runs. The fix is not a change to this file: it is to let
  # llvm-image finish and then rerun this workflow.
  # -------------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    permissions:
      contents: read
      # Reading the package is what the container pull needs. GITHUB_TOKEN is
      # passed as the registry credential because the package is private until
      # somebody makes it public, and a job cannot pull a private GHCR image
      # anonymously.
      packages: read

    container:
      image: ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Inside a job container the runner falls back to sh for run steps, and sh
    # is dash on this image, which rejects set -o pipefail. bash is present in
    # the image, it just has to be asked for by name.
    defaults:
      run:
        shell: bash

    env:
      CCACHE_DIR: /work/.ccache
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Report the image this job is running in
        run: |
          set -euxo pipefail
          cat /opt/llvm/llvm-project-sha.txt
          mlir-opt --version
          clang --version
          echo "expected LLVM tag: ${LLVM_TAG}"

      # Section 19: cache the build directory and ccache between runs, keyed on
      # the LLVM tag. The tag is in the key because a different LLVM is a
      # different ABI and reusing objects across it is how a confusing link
      # error gets manufactured.
      - name: Restore the ccache and build cache
        uses: actions/cache@v4
        with:
          path: |
            /work/.ccache
            build
          key: npu-build-${{ env.LLVM_TAG }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            npu-build-${{ env.LLVM_TAG }}-${{ runner.os }}-

      # The paths are the install prefix of docker/Dockerfile.llvm. They are
      # written out rather than taken from the image's MLIR_DIR and LLVM_DIR,
      # so that this file records what it expects the image to contain.
      - name: "Configure (activation table: P0, on)"
        run: |
          set -euxo pipefail
          # LLVM_EXTERNAL_LIT: an installed LLVM does not ship the build tree's
          # llvm-lit script, so against /opt/llvm the lit target must be told
          # to use the pip installed lit. The local build against the LLVM
          # build tree does not need this, which is exactly why CI caught it
          # (D-0005).
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMLIR_DIR=/opt/llvm/lib/cmake/mlir \
            -DLLVM_DIR=/opt/llvm/lib/cmake/llvm \
            -DLLVM_EXTERNAL_LIT="$(command -v lit)" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_USE_LINKER=lld

      # Section 3.3 writes -j6, which is right for the memory capped WSL2 guest
      # it was written for. A hosted runner is 4 vCPU, so -j4 is the matching number
      # here: -j6 on four cores buys nothing and costs memory headroom.
      - name: "Build (activation table: P0, on)"
        run: |
          set -euxo pipefail
          ninja -C build -j4
          ccache --show-stats || true

      - name: "check-npu (activation table: P0, on)"
        # Permitted to report zero tests until P1 per the activation table. It
        # currently runs one lit smoke test, so this is meaningful already.
        run: ninja -C build check-npu

      # ---- GoogleTest binaries. Each guarded on its binary existing. --------
      #
      # NPUInterfaceTests: ON at P2. The guard stays in place rather than being
      # deleted, for the same reason the reachability guard did at P1: it is what
      # the activation table asks for. But now that the phase has arrived, an
      # unsatisfied guard means the binary did not build, and reporting that as
      # "waiting for a phase" would be the activation table's own failure mode.
      # So the else branch fails rather than printing an off line.
      #
      # The binary building at all in this image is a P2 deliverable in its own
      # right. An installed LLVM prefix exports neither the `llvm_gtest` target
      # nor the bundled gtest headers, so the top level CMakeLists falls back to
      # find_package(GTest) and docker/Dockerfile.llvm installs libgtest-dev for
      # it to find. Before that pair of changes this step could never have run.
      - name: "NPUInterfaceTests (activation table: P2, on)"
        run: |
          set -euo pipefail
          if [ -x build/bin/NPUInterfaceTests ]; then
            ./build/bin/NPUInterfaceTests
          else
            echo "::error::NPUInterfaceTests did not build."
            echo "NPUInterfaceTests: this step is ON from P2, so a missing binary"
            echo "NPUInterfaceTests: is a build failure rather than a phase that has"
            echo "NPUInterfaceTests: not arrived. Check the configure log for the"
            echo "NPUInterfaceTests: 'GoogleTest:' line: the image must carry"
            echo "NPUInterfaceTests: libgtest-dev for the system package fallback."
            exit 1
          fi

      - name: "NPUAllocatorTests (activation table: P5)"
        run: |
          set -euo pipefail
          if [ -x build/bin/NPUAllocatorTests ]; then
            ./build/bin/NPUAllocatorTests
          else
            echo "NPUAllocatorTests: OFF until P5 (activation table 19.0)."
            echo "NPUAllocatorTests: guard is build/bin/NPUAllocatorTests existing."
          fi

      - name: "NPUEncodingTests (activation table: P6)"
        run: |
          set -euo pipefail
          if [ -x build/bin/NPUEncodingTests ]; then
            ./build/bin/NPUEncodingTests
          else
            echo "NPUEncodingTests: OFF until P6 (activation table 19.0)."
            echo "NPUEncodingTests: guard is build/bin/NPUEncodingTests existing."
          fi

      - name: "NPUSimulatorTests (activation table: P7)"
        run: |
          set -euo pipefail
          if [ -x build/bin/NPUSimulatorTests ]; then
            ./build/bin/NPUSimulatorTests
          else
            echo "NPUSimulatorTests: OFF until P7 (activation table 19.0)."
            echo "NPUSimulatorTests: guard is build/bin/NPUSimulatorTests existing."
          fi

      # ---- pytest. Off until P3, and the reason is in the table: an empty
      # collection exits 5 and that is not a pass. The guard is therefore a
      # test file existing, never the exit code.
      #
      # The second reason it stayed off at P0 is now resolved ahead of time. The
      # image was built with MLIR_ENABLE_BINDINGS_PYTHON=OFF, so the bindings
      # test/Python imports were not in the container at all, and turning pytest
      # on at P3 was going to mean republishing the image. P2 needed a republish
      # anyway to add googletest, so the bindings were switched on in the same
      # change and P3 inherits the image it needs. What remains for P3 is the
      # importer and the tests themselves.
      - name: "pytest (activation table: P3)"
        run: |
          set -euo pipefail
          echo "pytest: OFF until P3 (activation table 19.0)."
          echo "pytest: an empty collection exits 5 and is never read as a pass."
          echo "pytest: the image carries the MLIR Python bindings from P2 at"
          echo "pytest: /opt/llvm/python_packages/mlir_core, already on PYTHONPATH,"
          echo "pytest: so P3 needs the importer and its tests and no republish."

      - name: "pytest slow cells (activation table: P10)"
        run: |
          set -euo pipefail
          echo "pytest slow cells: OFF until P10 (activation table 19.0)."
          echo "pytest slow cells: the full matrix runs with -m 'slow or not slow'."

      # ---- Staleness gates. -------------------------------------------------
      # DIALECT_REFERENCE.md staleness: ON at P1.
      #
      # The step regenerates the file from the ODS source and diffs it against
      # the committed one. A difference means the dialect changed and the
      # reference did not, which is exactly the drift the generated reference
      # exists to make impossible. The diff itself is printed, because a gate
      # that says only "stale" makes the reader run the command locally to find
      # out what moved, and printing it costs nothing.
      #
      # git config safe.directory is needed because the checkout is owned by the
      # runner user and the container runs as root, so git refuses to read the
      # repository without being told it is trusted.
      - name: "DIALECT_REFERENCE.md staleness (activation table: P1, on)"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ ! -f docs/DIALECT_REFERENCE.md ]; then
            echo "docs/DIALECT_REFERENCE.md is missing. It is generated by"
            echo "  ninja -C build npu-dialect-doc"
            echo "and committed, and this step is ON from P1."
            exit 1
          fi
          ninja -C build npu-dialect-doc
          if ! git diff --quiet -- docs/DIALECT_REFERENCE.md; then
            echo "::error::docs/DIALECT_REFERENCE.md is stale."
            echo ""
            echo "The dialect source changed and the committed reference did not."
            echo "What moved:"
            echo ""
            git --no-pager diff -- docs/DIALECT_REFERENCE.md
            echo ""
            echo "Fix it with:"
            echo ""
            echo "    ninja -C build npu-dialect-doc"
            echo ""
            echo "and commit the result in the same commit as the dialect change."
            exit 1
          fi
          echo "docs/DIALECT_REFERENCE.md is up to date with the ODS source."

      - name: "ISA staleness gate (activation table: P6)"
        run: |
          set -euo pipefail
          if [ -f scripts/check-isa-staleness.sh ]; then
            bash scripts/check-isa-staleness.sh
          else
            echo "ISA staleness gate: OFF until P6 (activation table 19.0)."
            echo "ISA staleness gate: guard is scripts/check-isa-staleness.sh existing."
          fi

      # ---- Reachability, full. Off until P8, and the table explains why the
      # guard is a phase rather than a file: the model suite lands at P3 but
      # the full check also wants a lowering pattern (P4), an encoder case
      # (P6), and a simulator case (P7) for every operation. P8 is the first
      # phase at which it is passable rather than merely runnable, so a file
      # guard would switch it on at P3 and fail for four phases.
      - name: "check-reachability full (activation table: P8)"
        run: |
          set -euo pipefail
          echo "check-reachability full: OFF until P8 (activation table 19.0)."
          echo "check-reachability full: needs lowering (P4), encoding (P6), and simulation (P7) per operation; P8 is the first phase it can pass."

  # -------------------------------------------------------------------------
  # sanitizers. Off until P6. The job exists from P0 and says so in its log,
  # rather than being commented out: a job that is absent is a job nobody can
  # see is missing, and the point of the activation table is that the state of
  # every gate is visible in a run.
  # -------------------------------------------------------------------------
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: "sanitizers job is off (activation table: P6)"
        run: |
          set -euo pipefail
          echo "sanitizers: OFF until P6 (activation table 19.0)."
          echo "sanitizers: at P6 this becomes the same build with -fsanitize=address,undefined,"
          echo "sanitizers: running the GoogleTests including the whole of MalformedInputTest,"
          echo "sanitizers: plus the coverage guided target over the merged corpus in fuzz/corpus/."
          echo "sanitizers: it is off now because there is no corpus to run."

  # -------------------------------------------------------------------------
  # coverage. Off until P2. The table is precise about the two dates: the job
  # runs from P2 with thresholds of 0, so the number is recorded and its trend
  # is visible from the start, and P8 is where the real thresholds are set from
  # what P8 measures. Gating on a threshold before P8 would be gating on a
  # number nobody has measured.
  # -------------------------------------------------------------------------
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    env:
      # The threshold the activation table specifies between P2 and P8. It is an
      # input to the script rather than a constant inside it, so that P8 sets the
      # real number by editing one line here and the script itself does not
      # change when the policy does.
      NPU_COVERAGE_THRESHOLD: "0"
      NPU_COVERAGE_JOBS: "4"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      # gcc rather than clang, and gcovr rather than llvm-cov. Section 17.7
      # permits either; gcovr against gcc's --coverage is the pairing this
      # project uses, and mixing clang's instrumentation with gcovr's gcov
      # frontend is the combination that produces a plausible looking zero.
      - name: "coverage (activation table: P2, on; thresholds at P8)"
        run: |
          set -euo pipefail
          echo "coverage: ON from P2 with a threshold of ${NPU_COVERAGE_THRESHOLD}."
          echo "coverage: the number is recorded and its trend is visible from here;"
          echo "coverage: P8 sets the real thresholds from what P8 measures."
          echo ""
          bash scripts/coverage.sh "${NPU_COVERAGE_THRESHOLD}"

      # The JSON summary is the artifact, not the log. Section 17.7 is explicit
      # that CI parses a JSON summary rather than grepping a percentage out of a
      # log, and keeping the file is what lets P8 set its thresholds from a
      # series of measurements rather than from one run somebody remembered.
      - name: Upload the coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: |
            build-coverage/coverage.json
            build-coverage/coverage.html
          if-no-files-found: warn
          retention-days: 30
