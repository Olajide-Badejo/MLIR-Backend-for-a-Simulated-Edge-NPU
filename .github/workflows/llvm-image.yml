#
# Build docker/Dockerfile.llvm and publish it to GHCR. Section 19 makes
# publishing this image a P0 deliverable, because build-and-test pulls it and
# nothing else in CI works until it exists.

name: llvm-image

on:
  # Dispatch only, which is what Section 19 means by "manually dispatchable".
  # A push trigger existed for exactly one purpose: workflow_dispatch only
  # offers workflows that exist on the default branch, and this file was born
  # on phase/p0-foundations, so the first publish had to fire from a push.
  # That publish happened on 2026-08-19 and the trigger was retired in the
  # same phase: an LLVM rebuild is an hour of runner time and a moved tag
  # digest, and it should happen because somebody decided it should, never as
  # a side effect of a merge touching the Dockerfile.
  #
  # **How to republish from a branch, which is the question this design gets
  # asked every time and which no comment answered until P9b.** Dispatch offers
  # only workflows that exist on the default branch, and it separately offers a
  # **ref to run them on**. This file exists on `main`, so it is offered; the
  # ref selector is what decides which `docker/Dockerfile.llvm` gets built,
  # because the checkout step below takes `github.ref`. So a Dockerfile change
  # living on a phase branch is republished by pushing that branch and then
  # dispatching this workflow **against it**, with no change to this file and no
  # merge first. That ordering is the useful one: the image is live before the
  # branch merges, so the merge run is the first green run against it rather
  # than the run that discovers what the new image does.
  #
  #     gh workflow run llvm-image.yml --ref phase/<branch>
  #
  # The tag does not move, so nothing repins: `LLVM_IMAGE` in ci.yml names
  # `:llvmorg-22.1.8` and a republish moves what that tag resolves to. The
  # digest of what was published is printed by the last step below, because a
  # moving tag with no record of which commit produced the current digest is how
  # a bisect through a Dockerfile starts.
  workflow_dispatch:

# An LLVM build is on the order of an hour of runner time. Two pushes in quick
# succession to the same branch should not buy two of them, so the older run is
# cancelled. Cancelling in progress runs is safe here: the job's only effect is
# a pushed tag, and a cancelled build pushes nothing.
concurrency:
  group: llvm-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Lowercase owner is mandatory. GHCR rejects a path with an uppercase
  # character, and the GitHub account here is Olajide-Badejo, so the repository
  # owner cannot be interpolated directly into the image name.
  IMAGE: ghcr.io/olajide-badejo/npu-mlir-llvm
  LLVM_TAG: llvmorg-22.1.8

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    # Generous by design. A 4 vCPU runner building MLIR with assertions is
    # comfortably an hour, and a timeout that trips at the ninety minute mark
    # would throw away a build that was going to succeed.
    timeout-minutes: 360

    permissions:
      contents: read
      packages: write

    steps:
      # Section 19: disk is the binding constraint, not job time. This step is
      # the first of the three mandatory mitigations and it runs before
      # anything else, because reclaiming space after the build tree has
      # already filled the disk reclaims nothing. The other two mitigations
      # (slim install prefix, Native target with MLIR only) are in the
      # Dockerfile.
      - name: Free disk space on the runner
        run: |
          set -euxo pipefail
          echo "::group::disk before"
          df -h /
          echo "::endgroup::"
          # The preinstalled toolchains. None of them is used by an LLVM build
          # and between them they are the better part of twenty gigabytes.
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/Ruby"
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/go"
          # The preinstalled docker images are pulled by nothing here and the
          # builder needs the space in the same filesystem.
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "::group::disk after"
          df -h /
          echo "::endgroup::"

      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No cache-to and no registry cache. The layer that matters is the LLVM
      # build itself, exporting it would mean pushing tens of gigabytes of
      # builder layers to the registry, and the whole point of the slim prefix
      # is that those layers are thrown away rather than kept.
      #
      # push is unconditional: this workflow only runs on the two branches in
      # the trigger and on manual dispatch, and a build that is not pushed has
      # burned an hour of runner time to produce nothing.
      - name: Build and push the LLVM image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.llvm
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.LLVM_TAG }}
          build-args: |
            LLVM_TAG=${{ env.LLVM_TAG }}
            BUILD_JOBS=4
            LINK_JOBS=2

      # The tag is reused on every republish, so the tag alone does not say what
      # is behind it. This step is the record: which ref and which commit were
      # built, and which digest the tag now resolves to. Recording it in the run
      # log costs nothing and it is what a later reader needs to tell one
      # republish from another, since a run number is all the engineering log
      # can cite otherwise.
      - name: Report the published image and the disk left
        run: |
          set -euxo pipefail
          echo "published ${IMAGE}:${LLVM_TAG}"
          echo "  from ref    ${GITHUB_REF}"
          echo "  at commit   ${GITHUB_SHA}"
          echo "  digest      ${{ steps.build.outputs.digest }}"
          echo "build-and-test in ci.yml pulls exactly that reference, by tag,"
          echo "so this digest is what the next run of ci.yml will pull."
          df -h /
