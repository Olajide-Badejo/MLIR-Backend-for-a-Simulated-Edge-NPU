name: LLVM base image

# Builds LLVM and MLIR once at the pinned tag and publishes the result to GHCR,
# so CI never rebuilds LLVM per push. Run this manually, and only when the
# pinned tag changes.
#
# It is deliberately not on a push trigger. A run takes hours and produces a
# multi gigabyte image; triggering that on every commit to docker/ would be a
# trap.
#
# This is built in Actions rather than locally on purpose. The development
# machine's WSL2 guest has a hard 12 GB memory ceiling (see docs/BUILD.md), and
# building LLVM inside it while a container runtime is also resident thrashes.
# A GitHub runner has more headroom and nothing else to do.

on:
  workflow_dispatch:
    inputs:
      llvm_tag:
        description: "LLVM release tag to build"
        required: true
        default: "llvmorg-22.1.8"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: build and push
    runs-on: ubuntu-latest
    # An LLVM plus MLIR release build with assertions is slow on a two core
    # runner. The default 360 minute limit is the real constraint here.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        # The build tree plus the source checkout does not fit next to the
        # runner's preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the image tag
        id: tag
        run: |
          tag="${{ inputs.llvm_tag }}"
          echo "version=${tag#llvmorg-}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.llvm
          build-args: LLVM_TAG=${{ inputs.llvm_tag }}
          push: true
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/npu-mlir-llvm:${{ steps.tag.outputs.version }}
            ghcr.io/${{ steps.tag.outputs.owner }}/npu-mlir-llvm:latest
