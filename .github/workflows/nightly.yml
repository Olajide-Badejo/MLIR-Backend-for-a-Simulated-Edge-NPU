#
# The scheduled long running suite of Section 19: the full benchmark suite, the
# full end to end matrix, the long fuzz run, the mutation run, and the five
# times flake run. These are the checks that catch a slow drift, which is
# exactly the kind of failure that a per push pipeline never sees because none
# of them is cheap enough to run per push.
#
# Section 19 says this file exists from P0 with every job guarded off, and the
# jobs activate at the phases named in the 19.0 table. That is what this is: a
# real workflow on a real schedule where every job runs and prints which phase
# turns it on. A nightly that is added on the day its first job activates is a
# nightly whose schedule, permissions, and syntax have never been exercised.

name: nightly

on:
  # 03:30 UTC daily. Off the hour on purpose: scheduled workflows across GitHub
  # bunch up at :00, and a job queued behind that crowd starts late for no
  # reason. Nothing here is time of day sensitive.
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  LLVM_TAG: llvmorg-22.1.8
  LLVM_IMAGE: ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8

jobs:
  # ON at P6. The per push budget in ci.yml is one minute, which is what a pull
  # request can afford; this is the long run, and the difference between the
  # two is the whole reason a nightly exists.
  #
  # It is seeded from the committed corpus and from the whole of
  # MalformedInputTest's seven hundred and thirty three cases, exported through
  # NPU_CORPUS_OUT. The hand written cases are a bad fuzzer and a good set of
  # starting points: they reach deep validation branches that pure byte
  # mutation takes a long time to find, and handing them to the mutator costs
  # one gtest invocation.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: "Configure with the sanitizers (activation table: P6, on)"
        run: |
          set -euxo pipefail
          cmake -G Ninja -S . -B build-san \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMLIR_DIR=/opt/llvm/lib/cmake/mlir \
            -DLLVM_DIR=/opt/llvm/lib/cmake/llvm \
            -DLLVM_EXTERNAL_LIT="$(command -v lit)" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_USE_LINKER=lld \
            -DNPU_ENABLE_FUZZERS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DMLIR_PYTHON_PACKAGES_DIR=/opt/llvm/python_packages/mlir_core \
            2>&1 | tee build-san-configure.log
          grep -q '^-- Fuzzers: ON' build-san-configure.log

      - name: Build the fuzz target and the tests that seed it
        run: |
          set -euxo pipefail
          ninja -C build-san -j4 nbin_decode_fuzzer NPUEncodingTests

      # The seed and regression corpus, written out as extra starting points.
      # It is a negative test table rather than a generator, which is exactly
      # what makes it good seed material and exactly why it is not the thing
      # doing the fuzzing.
      - name: Export the seed corpus
        run: |
          set -euo pipefail
          mkdir -p build-san/exported-seeds
          NPU_CORPUS_OUT=build-san/exported-seeds \
            ./build-san/bin/NPUEncodingTests \
            --gtest_filter='MalformedInput.TheCorpusCanBeWrittenOutForTheFuzzer'
          echo "exported $(ls build-san/exported-seeds | wc -l) seeds"

      - name: "The long coverage guided run (activation table: P6, on)"
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          mkdir -p build-san/fuzz-artifacts
          ./build-san/bin/nbin_decode_fuzzer \
            -max_total_time=1800 \
            -print_final_stats=1 \
            -artifact_prefix=build-san/fuzz-artifacts/ \
            build-san/fuzz-corpus build-san/exported-seeds

      # Section 17.3: minimize every crash and commit it as a regression case.
      # The artifact is what makes that possible from a nightly nobody watched.
      - name: Upload any crash the run found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-crashes
          path: build-san/fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 90

      # Section 17.3 also asks for a cached merged corpus. Uploading what the
      # run grew is the cheap half of that; wiring it back in through a cache
      # key belongs with the rest of the nightly tuning at P10, and saying so
      # here is cheaper than leaving a reader to wonder whether it was missed.
      - name: Upload the corpus the run grew
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-corpus
          path: build-san/fuzz-corpus/
          if-no-files-found: warn
          retention-days: 14

  full-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "nightly full matrix job is off (activation table: P10)"
        run: |
          set -euo pipefail
          echo "nightly full matrix: OFF until P10 (activation table 19.0)."
          echo "nightly full matrix: at P10 this runs the full end to end matrix including the slow cells, with -m 'slow or not slow', plus the full benchmark suite."
          echo "nightly full matrix: it is off now because test/Python collects nothing and an empty collection exits 5, which is not a pass."

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "nightly mutation job is off (activation table: P15)"
        run: |
          set -euo pipefail
          echo "nightly mutation: OFF until P15 (activation table 19.0)."
          echo "nightly mutation: at P15 this runs scripts/mutation.sh, which Section 3.3 marks nightly only."
          echo "nightly mutation: it is off now because scripts/mutation.sh does not exist and there is no test suite for it to mutate against."

  flake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "nightly flake job is off (activation table: P15)"
        run: |
          set -euo pipefail
          echo "nightly flake: OFF until P15 (activation table 19.0)."
          echo "nightly flake: at P15 this runs the whole suite five times and fails on any test whose result is not identical across all five runs."
          echo "nightly flake: it is off now because there is no suite large enough for the result to mean anything."
