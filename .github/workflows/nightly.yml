# SPDX-License-Identifier: MIT
#
# The scheduled long running suite of Section 19: the full benchmark suite, the
# full end to end matrix, the long fuzz run, the mutation run, and the five
# times flake run. These are the checks that catch a slow drift, which is
# exactly the kind of failure that a per push pipeline never sees because none
# of them is cheap enough to run per push.
#
# Section 19 says this file exists from P0 with every job guarded off, and the
# jobs activate at the phases named in the 19.0 table. That is what this is: a
# real workflow on a real schedule where every job runs and prints which phase
# turns it on. A nightly that is added on the day its first job activates is a
# nightly whose schedule, permissions, and syntax have never been exercised.

name: nightly

on:
  # 03:30 UTC daily. Off the hour on purpose: scheduled workflows across GitHub
  # bunch up at :00, and a job queued behind that crowd starts late for no
  # reason. Nothing here is time of day sensitive.
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  LLVM_TAG: llvmorg-22.1.8
  LLVM_IMAGE: ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8

jobs:
  # ON at P6. The per push budget in ci.yml is one minute, which is what a pull
  # request can afford; this is the long run, and the difference between the
  # two is the whole reason a nightly exists.
  #
  # It is seeded from the committed corpus and from the whole of
  # MalformedInputTest's seven hundred and thirty three cases, exported through
  # NPU_CORPUS_OUT. The hand written cases are a bad fuzzer and a good set of
  # starting points: they reach deep validation branches that pure byte
  # mutation takes a long time to find, and handing them to the mutator costs
  # one gtest invocation.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: "Configure with the sanitizers (activation table: P6, on)"
        run: |
          set -euxo pipefail
          cmake -G Ninja -S . -B build-san \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMLIR_DIR=/opt/llvm/lib/cmake/mlir \
            -DLLVM_DIR=/opt/llvm/lib/cmake/llvm \
            -DLLVM_EXTERNAL_LIT="$(command -v lit)" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_USE_LINKER=lld \
            -DNPU_ENABLE_FUZZERS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DMLIR_PYTHON_PACKAGES_DIR=/opt/llvm/python_packages/mlir_core \
            2>&1 | tee build-san-configure.log
          grep -q '^-- Fuzzers: ON' build-san-configure.log

      - name: Build the fuzz target and the tests that seed it
        run: |
          set -euxo pipefail
          ninja -C build-san -j4 nbin_decode_fuzzer NPUEncodingTests

      # The seed and regression corpus, written out as extra starting points.
      # It is a negative test table rather than a generator, which is exactly
      # what makes it good seed material and exactly why it is not the thing
      # doing the fuzzing.
      - name: Export the seed corpus
        run: |
          set -euo pipefail
          mkdir -p build-san/exported-seeds
          NPU_CORPUS_OUT=build-san/exported-seeds \
            ./build-san/bin/NPUEncodingTests \
            --gtest_filter='MalformedInput.TheCorpusCanBeWrittenOutForTheFuzzer'
          echo "exported $(ls build-san/exported-seeds | wc -l) seeds"

      - name: "The long coverage guided run (activation table: P6, on)"
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          mkdir -p build-san/fuzz-artifacts
          ./build-san/bin/nbin_decode_fuzzer \
            -max_total_time=1800 \
            -print_final_stats=1 \
            -artifact_prefix=build-san/fuzz-artifacts/ \
            build-san/fuzz-corpus build-san/exported-seeds

      # Section 17.3: minimize every crash and commit it as a regression case.
      # The artifact is what makes that possible from a nightly nobody watched.
      - name: Upload any crash the run found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-crashes
          path: build-san/fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 90

      # Section 17.3 also asks for a cached merged corpus. Uploading what the
      # run grew is the cheap half of that; wiring it back in through a cache
      # key belongs with the rest of the nightly tuning at P10, and saying so
      # here is cheaper than leaving a reader to wonder whether it was missed.
      - name: Upload the corpus the run grew
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-corpus
          path: build-san/fuzz-corpus/
          if-no-files-found: warn
          retention-days: 14

  # ON at P10. The full end to end matrix including the slow cells, plus the
  # full benchmark suite of Section 16.1 with the 90 minute budget of Section 2
  # enforced as a gate.
  #
  # **Why the benchmark suite runs here and not in ci.yml.** Section 19 puts the
  # full benchmark suite in this file by name, and the reason it belongs here is
  # the reason its numbers exist at all: every cell carries a wall clock with a
  # confidence interval, the suite runs serially so that cells do not measure
  # each other's contention, and neither property survives sharing a runner with
  # the rest of a pull request's work.
  #
  # **The gate is the harness's own.** experiments/run_benchmarks.py fails when
  # the measured runtime exceeds --budget-minutes, which defaults to 90. This job
  # neither re-implements that check nor passes a different budget: a second
  # budget written into a workflow file is a second number to keep in step with
  # Section 2, and they would diverge. The job timeout is 120 minutes so that the
  # harness's own failure is what a reader sees rather than a cancelled job.
  #
  # **Measured on the developer machine at 1.76 minutes for 175 cells**, 0.60
  # seconds per cell, on a 14700K under WSL2. A hosted runner is four vCPU and
  # the suite is serial, so expect several times that and still far inside the
  # budget. Read the actual figure off the first green run and record it in
  # docs/ENGINEERING_LOG.md beside the local one.
  full-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/olajide-badejo/npu-mlir-llvm:llvmorg-22.1.8
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: "Configure and build (activation table: P10, on)"
        run: |
          set -euxo pipefail
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMLIR_DIR=/opt/llvm/lib/cmake/mlir \
            -DLLVM_DIR=/opt/llvm/lib/cmake/llvm \
            -DLLVM_EXTERNAL_LIT="$(command -v lit)" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_USE_LINKER=lld \
            -DMLIR_PYTHON_PACKAGES_DIR=/opt/llvm/python_packages/mlir_core
          ninja -C build -j4

      - name: Install the Python dependencies
        run: |
          set -euxo pipefail
          python3 -m pip install --break-system-packages -r requirements-lock.txt

      - name: "The full end to end matrix, slow cells included (activation table: P10, on)"
        env:
          MLIR_PYTHON_PACKAGES_DIR: /opt/llvm/python_packages/mlir_core
          NPU_BUILD_DIR: ${{ github.workspace }}/build
        run: |
          set -uo pipefail
          python3 -m pytest test/Python -q -m 'slow or not slow'
          status=$?
          if [ "$status" -eq 5 ]; then
            echo "::error::pytest collected no tests and exited 5."
            echo "nightly full matrix: an empty collection is never read as a pass."
            exit 1
          fi
          exit "$status"

      # The suite is written to a scratch directory rather than over
      # experiments/results/. A nightly that rewrote the committed results would
      # be a nightly that can move a recorded number with no commit behind it,
      # and every number this project publishes traces to those files. What this
      # run checks is that the suite still passes and still fits its budget on
      # another host; re-recording stays a deliberate act with a commit.
      - name: "The full benchmark suite against its 90 minute budget (activation table: P10, on)"
        env:
          MLIR_PYTHON_PACKAGES_DIR: /opt/llvm/python_packages/mlir_core
          NPU_BUILD_DIR: ${{ github.workspace }}/build
        run: |
          set -uo pipefail
          python3 experiments/run_benchmarks.py --results "${RUNNER_TEMP}/results"
          status=$?
          if [ "$status" -eq 1 ]; then
            echo "::error::the benchmark suite failed."
            echo ""
            echo "run-benchmarks: two readings, and they are not the same fault."
            echo ""
            echo "run-benchmarks:   1. The suite exceeded the 90 minute budget of"
            echo "run-benchmarks:      Section 2. The measured runtime and the cost"
            echo "run-benchmarks:      per cell are printed above. Do not raise the"
            echo "run-benchmarks:      budget: the question is what got slower, and"
            echo "run-benchmarks:      the per cell figure says whether it is the"
            echo "run-benchmarks:      suite growing or each cell costing more."
            echo ""
            echo "run-benchmarks:   2. An ablation moved the numerics outside the"
            echo "run-benchmarks:      end to end band. Section 16.2 makes that a"
            echo "run-benchmarks:      finding rather than a table row: the removed"
            echo "run-benchmarks:      pass is load bearing for correctness rather"
            echo "run-benchmarks:      than for performance, and the cell is named"
            echo "run-benchmarks:      in the output above."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::run_benchmarks could not run, exit ${status}."
            echo "run-benchmarks: exit 2 is the harness refusing to measure rather"
            echo "run-benchmarks: than a measurement that failed: a pass in the"
            echo "run-benchmarks: pipeline missing from the instrumentation, a"
            echo "run-benchmarks: schema field with no value and no reason, or a"
            echo "run-benchmarks: prediction that is not in any commit."
            exit "$status"
          fi

      - name: Upload the suite this run measured
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark-results
          path: |
            ${{ runner.temp }}/results
            ${{ runner.temp }}/results-runtime.json
          if-no-files-found: warn
          retention-days: 14

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "nightly mutation job is off (activation table: P15)"
        run: |
          set -euo pipefail
          echo "nightly mutation: OFF until P15 (activation table 19.0)."
          echo "nightly mutation: at P15 this runs scripts/mutation.sh, which Section 3.3 marks nightly only."
          echo "nightly mutation: it is off now because scripts/mutation.sh does not exist and there is no test suite for it to mutate against."

  flake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "nightly flake job is off (activation table: P15)"
        run: |
          set -euo pipefail
          echo "nightly flake: OFF until P15 (activation table 19.0)."
          echo "nightly flake: at P15 this runs the whole suite five times and fails on any test whose result is not identical across all five runs."
          echo "nightly flake: it is off now because there is no suite large enough for the result to mean anything."
