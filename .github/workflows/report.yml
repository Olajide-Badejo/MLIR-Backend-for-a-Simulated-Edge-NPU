name: Reports

# Builds both write ups and uploads them as artifacts. They used to be built by
# hand and committed, which is how report/main.pdf came to be several commits
# behind the results it cites.
#
# The results tables are regenerated from experiments/results/*.json by
# results_to_tex.py rather than hand copied, so this job also proves the
# committed results are complete enough to build a report from a clean clone.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build both PDFs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the plotting and table dependencies
        run: python -m pip install --quiet numpy matplotlib

      - name: Install tectonic
        run: |
          curl -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/

      - name: Cache the tectonic bundle
        # tectonic downloads the packages a document needs on first use.
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}

      # -B forces a rebuild. A git checkout gives every file the same mtime, so
      # make's timestamp comparison against the committed PDF is a coin flip and
      # the job would sometimes report success having built nothing.
      - name: Main report
        run: make -C report -B

      - name: Debug report
        run: make -C report_debug -B

      - name: Fail if either PDF is missing or empty
        run: |
          for pdf in report/main.pdf report_debug/debug_report.pdf; do
            test -s "$pdf" || { echo "$pdf was not produced"; exit 1; }
            echo "$pdf: $(stat -c%s "$pdf") bytes"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            report/main.pdf
            report_debug/debug_report.pdf
          if-no-files-found: error
