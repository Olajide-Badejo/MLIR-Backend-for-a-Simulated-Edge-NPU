version = 1
SPDX-PackageName = "npu-mlir"
SPDX-PackageSupplier = "Olajide Badejo <olajideayomidebadejo@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/Olajide-Badejo/MLIR-Backend-for-a-Simulated-Edge-NPU"

# Everything in this file is here because the file itself cannot carry a
# header. That is the whole test I apply before adding an entry: if a header
# would work, the header goes in the file and not in here, because a header
# travels with the file and a table entry does not.

# The licence text of the project's own licence. Adding a copyright header to
# the MIT text would be modifying the licence, which is not a thing anyone is
# allowed to do.
[[annotations]]
path = "LICENSE"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Olajide Badejo <olajideayomidebadejo@gmail.com>"
SPDX-License-Identifier = "MIT"

# The four files carried forward from v1 as live files rather than as history.
# They are my own work and are MIT like the rest of the project. They get their
# tags here rather than in a header because the v1 tree removal commit promised
# to carry them forward unmodified, and editing four files to add a header in
# the very next commit would make that promise false for no gain.
[[annotations]]
path = [
  "CHANGELOG.md",
  "docs/ASSESSMENT.md",
  "docs/ENGINEERING_LOG.md",
  "report/references.bib",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Olajide Badejo <olajideayomidebadejo@gmail.com>"
SPDX-License-Identifier = "MIT"

# The fuzz seed corpus. These are binary files whose exact bytes are the test,
# and three of them sit exactly one byte away from a valid file. A header would
# not merely be inconvenient here, it would change the input the seed exists to
# be. fuzz/README.md carries the recipe that regenerates every one of them, so
# the corpus is reproducible rather than merely present.
[[annotations]]
path = "fuzz/corpus/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Olajide Badejo <olajideayomidebadejo@gmail.com>"
SPDX-License-Identifier = "MIT"

# The generated opcode list of Section 9.4. JSON has no comment syntax at all,
# so a header here would not be inconvenient, it would make the file invalid
# JSON and scripts/check-reachability.py would stop being able to read it. The
# generator emits a `do_not_edit` field instead, which is the closest thing the
# format has to a comment and is machine readable besides.
[[annotations]]
path = "docs/ISA_OPCODES.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Olajide Badejo <olajideayomidebadejo@gmail.com>"
SPDX-License-Identifier = "MIT"

# The regression baseline of Section 17.6. `baseline.json` is JSON, which has
# no comment syntax, and the golden tensors are numpy's binary `.npy` format,
# whose bytes are compared for exact equality. A header in either would be a
# header inside the thing being compared. Both are generated by
# `scripts/regression-baseline.sh` and both are committed on purpose: the whole
# point of a baseline is that it is the recorded past rather than something a
# run recomputes.
[[annotations]]
path = [
  "test/baseline/baseline.json",
  "test/baseline/golden/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Olajide Badejo <olajideayomidebadejo@gmail.com>"
SPDX-License-Identifier = "MIT"

# The recorded results of Section 16.1, one JSON per cell, plus the file that
# records what the run cost. JSON has no comment syntax, and a header key inside
# a result would be a field that is not in the schema, which the loader refuses
# by design: every field is present in every file and nothing else is. They are
# generated by `experiments/run_benchmarks.py` and committed on purpose, because
# a result is the recorded past rather than something a run recomputes, and
# because law 3 of Section 0.2 needs every published number to trace to a
# committed file.
[[annotations]]
path = [
  "experiments/results/**",
  "experiments/results-runtime.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Olajide Badejo <olajideayomidebadejo@gmail.com>"
SPDX-License-Identifier = "MIT"

# The dash linter fixture. Every byte of these files is the test: each one
# exists to pin what the linter does with a particular sequence of characters,
# and half of them are supposed to fail. A header would add lines the fixture
# did not ask for and, in the .tex and .md cases, would put a comment syntax
# into a file whose parsing is part of what is under test.
[[annotations]]
path = "scripts/testdata/dash-lint-fixture/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Olajide Badejo <olajideayomidebadejo@gmail.com>"
SPDX-License-Identifier = "MIT"
