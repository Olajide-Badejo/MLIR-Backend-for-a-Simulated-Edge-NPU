[project]
name = "npu-mlir"
version = "2.0.0.dev0"
description = "An MLIR backend and simulator for a simulated edge NPU"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Olajide Badejo", email = "olajideayomidebadejo@gmail.com" }]

# Every version below is what is actually installed in ~/npu-venv on
# 2026-08-19, read out of `pip freeze` rather than copied from the build
# specification. The floor is 3.11 because zigzag-dse sets it; the interpreter
# in use is 3.14.4. Exact pins here plus requirements-lock.txt for the full
# transitive closure is the two layer arrangement Section 3.3 asks for: this
# list says what I chose, the lock file says what that resolved to.
dependencies = [
  "numpy==2.5.1",
  "onnx==1.22.0",
  "onnxruntime==1.27.0",
  # Not optional, and not something torch pulls in on its own. torch's dynamo
  # exporter imports onnxscript at export time, Section 15 forbids reaching for
  # dynamo=False to avoid it, and the build specification names a missing
  # onnxscript as the single highest probability blocker at P3. The model
  # generator depends on it directly, so it is listed as a direct dependency.
  "onnxscript==0.7.1",
  "torch==2.13.0",
  "nanobind==2.13.0",
  "matplotlib==3.11.0",
  "tqdm==4.68.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "black==26.5.1",
  "ruff==0.15.21",
  "mypy==2.3.0",
  "gcovr==8.6",
  "pre-commit==4.6.2",
  "reuse==6.2.0",
]

[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

# ---------------------------------------------------------------------------
# The grammar target of both formatters is `requires-python`'s floor and not the
# developer's interpreter, and that is D-0038 rather than a preference.
#
# It said py314 here, with a comment arguing against the v1 tree's py312 on the
# grounds that applying an older grammar target to code running on a 3.14
# interpreter shows up as a formatting argument rather than as an actionable
# error. That reasoning was right about the direction it looked and wrong about
# which interpreter matters. **The interpreter that matters is the lowest one
# that runs this code, not the highest.** `scripts/dash-lint.sh` deliberately
# falls back to whatever `python3` is on `PATH`, because CI calls it before any
# venv exists, and inside the CI container that is Ubuntu 24.04's 3.12. So a
# py314 target let two unparenthesised `except A, B:` clauses through, PEP 758
# syntax that is a `SyntaxError` on 3.12, and the whole linter failed to parse
# the first time anything ran it in the container. Three phases after it landed.
#
# py311 is `requires-python` above, so the declared floor is now enforced by a
# tool instead of promised in a field nothing reads. Measured on 2026-09-01
# before the change: at py311 ruff finds exactly those two errors in the whole
# tree and nothing else, and `black --check --target-version py311` leaves all
# forty two files unchanged. So the v1 formatting argument the old comment
# feared does not arise here, which is a measurement rather than a hope.
[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["scripts/testdata"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# lit exec's its config files with a `config` object already bound in the
# namespace, and with `lit_config` bound in the site config. There is no import
# to write for either and upstream MLIR writes them the same way, so F821 here
# is ruff describing lit's calling convention rather than finding a bug.
"test/lit.cfg.py" = ["F821"]
"test/lit.site.cfg.py.in" = ["F821"]

[tool.mypy]
# 3.12 and not 3.14, for D-0038's reason, and not 3.11, for a different one that
# is worth recording rather than rounding off.
#
# The reason it is not 3.14: mypy at the developer's interpreter would accept a
# 3.14 only stdlib call in code that runs on the CI container's 3.12, which is
# the type checked half of the defect the grammar targets above fix.
#
# The reason it is not 3.11, which is `requires-python`'s floor: at
# `--python-version 3.11` mypy stops inside **numpy's own shipped stubs**,
# `numpy/__init__.pyi:737: Type statement is only supported in Python 3.12 and
# greater`, and checks nothing further. So the floor this project can type check
# against is set by a dependency rather than by its own code. 3.12 is clean and
# is also exactly the interpreter the CI image ships, which makes it the useful
# bound: it is the lowest interpreter this project is actually run on.
python_version = "3.12"
files = ["python/npu_frontend", "scripts"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
exclude = ["scripts/testdata/"]

# Neither the MLIR Python bindings nor onnx ship type information usable here.
# The bindings are generated by the LLVM build and are not pip installed at
# all, so mypy cannot see them; onnx's protobuf generated classes are dynamic.
# Both are boundaries where Any is the honest annotation.
[[tool.mypy.overrides]]
module = ["mlir.*", "onnx.*", "onnxruntime.*", "torch.*"]
ignore_missing_imports = true

# The external cross validation tools, which are **installed in one environment
# and absent in the other**, and that is the whole reason this override exists
# rather than a comment on the import. See D-0046.
#
# `scripts/patch-scalesim.py` imports `scalesim` to find where it is installed.
# On the developer machine the package resolves and ships no `py.typed`, so mypy
# reports `import-untyped`. In the CI image the package is not there at all, so
# mypy reports `import-not-found`. A line level `# type: ignore[import-untyped]`
# is correct in the first environment and **wrong in the second twice over**: it
# does not cover the error that actually fires, and `warn_unused_ignores` then
# reports the ignore itself as unused. That is two errors on one line, and it is
# what CI found.
#
# `ignore_missing_imports` for this module covers both codes, is scoped to the
# one module that has the problem, and leaves every global strictness setting
# above untouched.
#
# **Exactly one module is listed, and that is `warn_unused_configs` doing its
# job.** The first version of this override also named `scalesim.*`, `accelergy`
# and `accelergy.*`, on the reasoning that the neighbouring tools would need the
# same treatment. mypy reported all three as unused sections, because nothing
# mypy checks imports them: `experiments/` is not in `files` above, and only the
# bare `scalesim` name is imported. Config that does nothing is config nobody
# will notice has stopped matching, so it went.
[[tool.mypy.overrides]]
module = ["scalesim"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test/Python"]
# The MLIR Python bindings are not pip installed. They resolve only out of the
# LLVM build tree, so pytest has to be told where that is or every test in
# test/Python fails at import for a reason that has nothing to do with the
# code under test. Section 3.3 of the build specification names three places
# this wiring has to exist and this is the third; the others are the
# MLIR_PYTHON_PACKAGES_DIR variable in CMakeLists.txt and test/lit.cfg.py.
#
# `pythonpath` here puts this project's own package root on sys.path. The
# bindings path is added by test/Python/conftest.py instead of by a
# `env = [...]` key, because that key belongs to the pytest-env plugin, which
# is not installed: pytest accepts an unknown key with a warning and then
# ignores it, so the wiring would read as present and do nothing. A conftest
# needs no plugin and can derive the path instead of hardcoding a home
# directory.
pythonpath = ["python"]
# The end to end matrix is one model times three levels times two budgets times
# five input classes. Every cell compiles and simulates, so running all of them
# is too slow for an edit and rerun loop but is exactly what CI should do. The
# default deselects the slow cells; CI passes -m "slow or not slow" to run the
# whole matrix.
addopts = "-m 'not slow'"
markers = [
  "slow: a matrix cell outside the fast subset; run with -m 'slow or not slow'",
]
