[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["python/npu_frontend"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

# Neither the MLIR Python bindings nor onnx ship type information usable here.
# The bindings are generated by the LLVM build and are not pip installed at all,
# so mypy cannot see them; onnx's protobuf generated classes are dynamic. Both
# are boundaries where Any is the honest annotation.
[[tool.mypy.overrides]]
module = ["mlir.*", "onnx.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test/Python"]
# The end to end matrix is one model times three levels times two budgets times
# five input classes. Every cell compiles and simulates, so running all of them
# is too slow for an edit and rerun loop but is exactly what CI should do. The
# default deselects the slow cells, leaving one per optimization level; CI passes
# -m "slow or not slow" to run the whole matrix. See docs/CONTRIBUTING.md.
addopts = "-m 'not slow'"
markers = [
  "slow: a matrix cell outside the fast subset; run with -m 'slow or not slow'",
]
