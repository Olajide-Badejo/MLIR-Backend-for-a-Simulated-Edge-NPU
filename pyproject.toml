[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["python/npu_frontend"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

# Neither the MLIR Python bindings nor onnx ship type information usable here.
# The bindings are generated by the LLVM build and are not pip installed at all,
# so mypy cannot see them; onnx's protobuf generated classes are dynamic. Both
# are boundaries where Any is the honest annotation.
[[tool.mypy.overrides]]
module = ["mlir.*", "onnx.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["test/Python"]
